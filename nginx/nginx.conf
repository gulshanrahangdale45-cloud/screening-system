worker_processes auto;
events { worker_connections 2048; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  server_tokens off;
  sendfile on;
  keepalive_timeout 30;
  client_max_body_size 12m;
  client_body_timeout 15s;

  # Per-client-IP rate limits
  limit_req_zone  $binary_remote_addr zone=api:10m   rate=20r/s;
  limit_req_zone  $binary_remote_addr zone=login:10m rate=5r/m;
  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_status 429;

  # Load balancing across stateless API replicas
  upstream screening_api {
    least_conn;
    server api1:8000 max_fails=3 fail_timeout=15s;
    server api2:8000 max_fails=3 fail_timeout=15s;
    server api3:8000 max_fails=3 fail_timeout=15s;
    keepalive 32;
  }

  server {
    listen 80;
    server_name _;

    # Production: terminate TLS here (listen 443 ssl), redirect 80 -> 443 and add
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;

    location = /api/auth/login {
      limit_req zone=login burst=5 nodelay;
      proxy_pass http://screening_api;
    }

    location /api/ {
      limit_req zone=api burst=40 nodelay;
      limit_conn perip 20;
      proxy_pass http://screening_api;
    }

    location / {
      root /usr/share/nginx/html;
      try_files $uri $uri/ /index.html;
    }

    location ~ /\. { deny all; }
  }
}

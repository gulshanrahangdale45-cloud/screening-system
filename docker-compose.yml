x-api: &api
  build: ./backend
  env_file: .env
  environment:
    DATABASE_URL: postgresql+psycopg2://screen:${DB_PASSWORD}@db:5432/screening
    UPLOAD_DIR: /data/uploads
  volumes:
    - uploads:/data/uploads
  expose:
    - "8000"
  depends_on:
    db:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: screening
      POSTGRES_USER: screen
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U screen -d screening"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api1:
    <<: *api
  api2:
    <<: *api
  api3:
    <<: *api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api1
      - api2
      - api3
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
